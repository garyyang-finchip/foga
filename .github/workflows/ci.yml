name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  world:
    name: bundle, world, doctor, genesis
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Foundry (pinned)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Install dependencies
        run: npm ci

      - name: Install the proving libraries (prover/)
        run: npm run zk:install

      - name: Restore the predicate circuit's proving material (development ceremony output)
        id: zk-cache
        uses: actions/cache@v5
        with:
          path: |
            zk/build/kya_predicate_count_v1_js
            zk/build/kya_predicate_count_v1_final.zkey
            zk/build/kya_predicate_count_v1.r1cs
          key: zk-predicate-${{ hashFiles('zk/circuits/kya_predicate_count_v1.circom', 'prover/build-predicate.mjs', 'prover/package-lock.json') }}

      - name: Rebuild the predicate circuit and its development ceremony (cache miss only; deterministic)
        if: steps.zk-cache.outputs.cache-hit != 'true'
        run: |
          npm run zk:predicate
          # the ceremony is deterministic: the regenerated verification key and verifier must equal the committed ones
          git diff --exit-code -- zk/build/verification_key.json contracts/src/zk/Groth16PredicateVerifier.sol

      - name: Type-check and unit tests
        run: |
          npx tsc -p tsconfig.json --noEmit
          npm test

      - name: Foundry tests for the local contracts
        working-directory: contracts
        run: forge test -vv

      - name: Materialize the locked upstream sources
        run: npm run vendor:sync

      - name: Rebuild the artifact bundle and verify its hash
        run: npm run bundle:verify

      - name: Start anvil
        run: |
          anvil --silent --port 8545 &
          for i in $(seq 1 40); do
            if curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 >/dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "anvil did not start" && exit 1

      - name: Deploy the local world
        run: npm run foga -- world deploy --world worlds/local.json --rpc http://127.0.0.1:8545 --out deployments/ci-local.json

      - name: Doctor (layers 1-4; exit 3 on any Fail)
        run: npm run foga -- doctor --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --out deployments/ci-local.doctor.json

      - name: Sourcify dry run over the deployed world (every contract matched to its own compiler run in the build-info; nothing is sent for a local chain)
        run: |
          npm run foga -- world verify --world deployments/ci-local.json --sourcify --dry-run --out "$RUNNER_TEMP/sourcify"
          node -e '
            const r = require(process.env.RUNNER_TEMP + "/sourcify/report.json");
            if (r.missing.length) throw new Error("contracts without a matching build-info: " + JSON.stringify(r.missing));
            if (r.summary["dry-run"] !== 47) throw new Error("expected 47 dry-run requests, got " + JSON.stringify(r.summary));
          '

      - name: Genesis T0-T9 with both ZK paths required, crashed after the submit of T3 (exit 75 expected)
        run: |
          set +e
          npm run foga -- genesis run --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --until T9 --zk require --store deployments/ci-local.genesis.sqlite --out deployments/ci-local.genesis.json --crash-after T3.A.submit
          code=$?
          set -e
          test "$code" -eq 75 || { echo "expected the injected crash (75), got $code"; exit 1; }

      - name: Genesis resumed (recovers the submit by hash, settles, carries on to T9; exit 0)
        run: |
          npm run foga -- genesis run --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --until T9 --zk require --store deployments/ci-local.genesis.sqlite --out deployments/ci-local.genesis.json
          node -e '
            const e = require("./deployments/ci-local.genesis.json");
            if (e.summary.failed !== 0) throw new Error("checks failed: " + JSON.stringify(e.checks.filter(c => !c.pass)));
            if (e.summary.recovered !== 1) throw new Error("expected exactly one recovered operation, got " + e.summary.recovered);
            for (const name of ["submissions.one", "A.kya.S_cred.level4", "A.kya.S_pred.shown", "A.kya.S_pred.below.refused", "swarm.active", "council.final.yes", "nd.claimUnjudged", "swarm.achieved", "ruling.sustained", "refund.enacted", "bypass.reverted", "derisk.allowed", "escape.sibling.refused", "anchor.stale.gate", "anchor.window.restored", "resolver.A", "resolver.doubleCount", "A.retired", "skill.adopted", "inherit.kya.none"]) {
              const c = e.checks.find(c => c.name === name);
              if (!c || !c.pass) throw new Error("check missing or failed: " + name);
              if (/^skipped:/.test(c.detail)) throw new Error("check was skipped: " + name + " (" + c.detail + ")");
            }
            if (e.facts["T0.zk"] !== "on") throw new Error("the credential ZK path did not run");
            if (e.facts["T0.zk.predicate"] !== "on") throw new Error("the predicate ZK path did not run");
          '

      - name: Doctor with the genesis evidence (layer 5 per standard; exit 3 on any Fail)
        run: npm run foga -- doctor --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --genesis deployments/ci-local.genesis.json --out deployments/ci-local.doctor.json

      - name: Genesis replayed (nothing sent, end state re-checked)
        run: |
          npm run foga -- genesis run --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --until T9 --zk require --store deployments/ci-local.genesis.sqlite --out deployments/ci-local.genesis.replay.json
          node -e '
            const e = require("./deployments/ci-local.genesis.replay.json");
            if (e.summary.failed !== 0) throw new Error("checks failed on replay");
            if (e.summary.sent !== 0) throw new Error("a replay sent " + e.summary.sent + " transactions");
          '
          npm run foga -- genesis status --world deployments/ci-local.json --store deployments/ci-local.genesis.sqlite

      - name: Loop D with the stub model (a new cell on the local world, the demander's cases a-g, the embedded node killed and restarted, the guardian's suspension, the HTTP entrance beside the runner; judged by the doctor beside layer 5)
        run: |
          npm run foga -- loop-d run --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --dir "$RUNNER_TEMP/loop-d" --out deployments/ci-loop-d.json --seed 7
          npm run foga -- doctor --world deployments/ci-local.json --rpc http://127.0.0.1:8545 --genesis deployments/ci-local.genesis.json --loop-d deployments/ci-loop-d.json --out deployments/ci-local.doctor.json

      - name: Quickstart (the wallet first, its own anvil and node ports, the documents on chain, the entrances checked; stops after the summary)
        run: |
          npm run foga -- quickstart --dir "$RUNNER_TEMP/quickstart" --wallet "$RUNNER_TEMP/wallet" --port 8547 --listen 127.0.0.1:8797 --exit > "$RUNNER_TEMP/quickstart.out"
          node -e '
            const fs = require("fs");
            const dir = process.env.RUNNER_TEMP + "/quickstart";
            for (const f of ["cell.config.json", "connect.md", "quickstart.json", "keys/agent.api-key", "documents/manifest.json", "documents/agent-card.json", "documents/registration.json", "mcp/claude_desktop_config.json", "mcp/claude-code.mcp.json", "mcp/cursor-mcp.json", "mcp/http-mcp.json"]) if (!fs.existsSync(dir + "/" + f)) throw new Error("quickstart did not write " + f);
            for (const f of ["wallet.json", "owner.key", "operator.key", "guardian.key"]) if (!fs.existsSync(process.env.RUNNER_TEMP + "/wallet/" + f)) throw new Error("the wallet lacks " + f);
            const desktop = JSON.parse(fs.readFileSync(dir + "/mcp/claude_desktop_config.json", "utf8"));
            if (!desktop.mcpServers.foga.args.includes("mcp")) throw new Error("the client configuration does not start the stdio server");
            if (desktop.mcpServers.foga.env.FOGA_OPERATOR_KEY_FILE !== require("path").resolve(process.env.RUNNER_TEMP, "wallet", "operator.key")) throw new Error("the client configuration does not name the operator key of the wallet: " + desktop.mcpServers.foga.env.FOGA_OPERATOR_KEY_FILE);
            const out = fs.readFileSync(process.env.RUNNER_TEMP + "/quickstart.out", "utf8");
            for (const re of [/a FOGA cell is live/, /Authorization: Bearer foga\.agent\./, /wallet +.*\(made now\)/, /documents .*committed on chain as URLs/, /A2A +POST http:\/\/127\.0\.0\.1:8797\/a2a/]) if (!re.test(out)) throw new Error("the summary lacks " + re + ":\n" + out.slice(0, 3000));
          '

      - name: Rehearse the public-chain path (attach-mode world on a second anvil, backing AID registry, hybrid deploy, genesis T0-T9, doctor)
        run: |
          anvil --silent --port 8546 &
          for i in $(seq 1 40); do
            if curl -s -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8546 >/dev/null; then break; fi
            sleep 0.5
          done
          npm run foga -- world deploy --world worlds/local.json --rpc http://127.0.0.1:8546 --out .foga-build/rehearsal-base.json
          node scripts/attach-rehearsal.mjs .foga-build/rehearsal-base.json .foga-build/local-attach.config.json http://127.0.0.1:8546
          npm run foga -- world deploy --world .foga-build/local-attach.config.json --rpc http://127.0.0.1:8546 --out deployments/ci-local-attach.json
          node -e '
            const w = require("./deployments/ci-local-attach.json");
            const deployed = w.steps.filter(s => s.status === "deployed").map(s => s.id);
            if (deployed.length !== 15) throw new Error("expected 15 contracts deployed from the bundle, got " + deployed.join(","));
            if (!w.steps.some(s => s.id === "8444/registerKinds" && s.status === "skipped")) throw new Error("kind registration should be skipped on an attached ARD registry");
          '
          npm run foga -- genesis preflight --world deployments/ci-local-attach.json --rpc http://127.0.0.1:8546
          npm run foga -- genesis run --world deployments/ci-local-attach.json --rpc http://127.0.0.1:8546 --until T9 --zk require --store deployments/ci-local-attach.genesis.sqlite --out deployments/ci-local-attach.genesis.json
          node -e '
            const e = require("./deployments/ci-local-attach.genesis.json");
            if (e.summary.failed !== 0) throw new Error("checks failed: " + JSON.stringify(e.checks.filter(c => !c.pass)));
            for (const name of ["A.aid.backing", "A.ard.backed", "service.policy", "ruling.sustained", "anchor.backing.active", "anchor.window.restored", "Aprime.backing.active", "Aprime.record"]) {
              const c = e.checks.find(c => c.name === name);
              if (!c || !c.pass || /^skipped:/.test(c.detail)) throw new Error("check missing, failed or skipped: " + name);
            }
            if (!e.journal.some(j => j.opKey === "T1.A.aid.backing.bind" && j.event === "confirmed")) throw new Error("the backing registry bind did not run");
          '
          npm run foga -- doctor --world deployments/ci-local-attach.json --rpc http://127.0.0.1:8546 --genesis deployments/ci-local-attach.genesis.json --out deployments/ci-local-attach.doctor.json

      - name: Attach the Sepolia world (address book only; no RPC in CI; warns about the steps foga world deploy adds)
        run: npm run foga -- world attach --world worlds/sepolia.json --out deployments/ci-sepolia.json

      - name: Compile the CLI
        run: npm run build && node bin/foga.js --help

      - name: Pack the npm tarball and run the packaged CLI from a clean install (help, catalog, a cell born on the local world, MCP over stdio)
        shell: bash
        run: |
          # the tail of a failure becomes an annotation, readable on the run's summary page without the logs
          set -o pipefail
          if ! node scripts/pack-smoke.mjs http://127.0.0.1:8545 deployments/ci-local.json "$RUNNER_TEMP/foga-pack" 2>&1 | tee "$RUNNER_TEMP/pack-smoke.log"; then
            echo "::error title=pack smoke failed::$(tail -c 1200 "$RUNNER_TEMP/pack-smoke.log" | tr -d '\r' | tr '\n' ' ')"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: world-doctor-genesis
          path: |
            deployments/ci-local.json
            deployments/ci-local.doctor.json
            deployments/ci-local.genesis.json
            deployments/ci-local.genesis.replay.json
            deployments/ci-loop-d.json
            deployments/ci-local-attach.json
            deployments/ci-local-attach.genesis.json
            deployments/ci-local-attach.doctor.json
            deployments/ci-sepolia.json
            .foga-build/bundle.verify.json
          if-no-files-found: ignore
