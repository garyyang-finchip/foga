# One-command local world: anvil + world deploy + doctor + genesis T0-T9 (the ZK paths are left out: the image carries no proving material).
#   docker compose up --build
# The address book, the doctor report and the genesis evidence land in ./deployments
# (local.json, local.doctor.json, local.genesis.json; the operation store local.genesis.sqlite).
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--silent"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  world:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./deployments:/opt/foga/deployments
    command: ["foga", "world", "deploy", "--world", "worlds/local.json", "--rpc", "http://anvil:8545", "--out", "deployments/local.json"]

  doctor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      world:
        condition: service_completed_successfully
    volumes:
      - ./deployments:/opt/foga/deployments
    command: ["foga", "doctor", "--world", "deployments/local.json", "--rpc", "http://anvil:8545", "--out", "deployments/local.doctor.json"]

  genesis:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      doctor:
        condition: service_completed_successfully
    volumes:
      - ./deployments:/opt/foga/deployments
    # anvil starts fresh with every `compose up`, so the operation store of the previous run is removed first
    command: ["sh", "-c", "rm -f deployments/local.genesis.sqlite deployments/local.genesis.sqlite-* && foga genesis run --world deployments/local.json --rpc http://anvil:8545 --until T9 --store deployments/local.genesis.sqlite --out deployments/local.genesis.json && foga doctor --world deployments/local.json --rpc http://anvil:8545 --genesis deployments/local.genesis.json --out deployments/local.doctor.json"]
